server:
  port: 8084
  error:
    include-message: always
spring:
  application:
    name: lifecycle-service
  datasource:
    url: jdbc:h2:mem:lifecycledb;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false
