server:
  port: 8083
  error:
    include-message: always
spring:
  application:
    name: question-service
  datasource:
    url: jdbc:h2:mem:questiondb;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false
app:
  services:
    validation-url: ${VALIDATION_URL:http://localhost:8082}
    lifecycle-url: ${LIFECYCLE_URL:http://localhost:8084}
